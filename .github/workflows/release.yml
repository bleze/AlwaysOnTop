name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ steps.version.outputs.version }}" `
            installer\AlwaysOnTop.iss

      - name: Zip portable binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\Release\AlwaysOnTop.exe, "build\Release\AlwaysOnTopHook-${{ steps.version.outputs.version }}.dll" `
            -DestinationPath "dist\AlwaysOnTop-${{ steps.version.outputs.version }}-portable.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AlwaysOnTop-Setup-${{ steps.version.outputs.version }}.exe
            dist/AlwaysOnTop-${{ steps.version.outputs.version }}-portable.zip
            build/Release/AlwaysOnTop.exe
            build/Release/AlwaysOnTopHook-${{ steps.version.outputs.version }}.dll
          generate_release_notes: true
